name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm test

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Verify Expo authentication
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}

      - name: Build Android
        run: eas build --platform android --profile preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}

      - name: Build Summary
        run: |
          echo "## 📱 Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Build iniciado com sucesso!" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch**: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Data**: $(date)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "🔗 Acompanhe o status do build no EAS Build Console." >> "$GITHUB_STEP_SUMMARY"
          echo "_Nota: o build roda em background (--no-wait). Verifique o console do EAS para acompanhar o APK quando estiver pronto._" >> "$GITHUB_STEP_SUMMARY"
