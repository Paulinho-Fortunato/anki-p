name: Build
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20' # Forçar Node 20 LTS para estabilidade
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type Check
        run: npx tsc --noEmit
      
      - name: Run Tests
        run: npm test
      
      # Instalação explícita do EAS CLI via npm para evitar erro interno do yarn
      - name: Install EAS CLI
        run: npm install -g eas-cli
      
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EAS_ACCESS_TOKEN }}
          # Não tentar instalar expo-cli automaticamente
          expo-version: skip
      
      - name: Build Android (Preview)
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_NO_GIT_CLEAN: 1 # Evita problemas com git dirty
      
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            *.apk
            build/outputs/**/*.apk
          
      - name: Output Summary
        run: |
          echo "## 📱 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build concluído com sucesso!" >> $GITHUB_STEP_SUMMARY
          echo "🤖 Android: APK disponível nos artifacts acima" >> $GITHUB_STEP_SUMMARY
          echo "⏳ iOS: Requer configuração adicional de certificados (ver README)" >> $GITHUB_STEP_SUMMARY
