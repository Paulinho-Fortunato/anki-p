name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Usar Node 20 LTS para estabilidade
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm test

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Setup Expo and EAS Auth
        uses: expo/expo-github-action@v8
        with:
          # Não pedimos para a ação instalar nada, apenas configurar o auth
          expo-version: skip
          eas-version: skip
          token: ${{ secrets.EAS_ACCESS_TOKEN }}

      - name: Build Android (Preview)
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_CI: 'true'

      - name: Upload Artifact (Android)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-apk
          path: '*.apk'
          retention-days: 14

      - name: Post Build Summary
        if: always()
        run: |
          echo "## 📱 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Node: 20" >> $GITHUB_STEP_SUMMARY
          if [ -f "*.apk" ]; then
            echo "- APK: Gerado com sucesso (verifique os artifacts)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- APK: Não encontrado (pode ter falhado ou movido)" >> $GITHUB_STEP_SUMMARY
          fi
