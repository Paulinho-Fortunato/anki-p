name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm install

      - name: Verify dependencies
        run: |
          test -f package-lock.json
          npm ls query-string expo-asset

      - name: Type Check
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm test

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Verify Expo authentication
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}

      - name: Link Expo project
        run: eas init --account paulinho_dev --non-interactive --force
        env:
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}

      - name: Build Android APK
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > eas-build.json
        env:
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}

      - name: Show build result
        run: cat eas-build.json

      - name: Download APK
        shell: bash
        run: |
          set -euo pipefail

          apk_url="$(jq -r '
            if type == "array" then .[] else . end
            | .artifacts.buildUrl
              // .artifacts.applicationArchiveUrl
              // .artifactUrl
              // empty
          ' eas-build.json | head -n 1)"

          if [ -z "$apk_url" ] || [ "$apk_url" = "null" ]; then
            echo "URL do APK não encontrada."
            cat eas-build.json
            exit 1
          fi

          echo "Baixando APK..."
          curl --fail --location --retry 3 "$apk_url" \
            --output app-preview.apk

          test -s app-preview.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anki-p-preview-apk
          path: app-preview.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Summary
        run: |
          echo "## 📱 APK gerado" >> "$GITHUB_STEP_SUMMARY"
          echo "O APK foi gerado e está disponível nos artefatos desta execução." >> "$GITHUB_STEP_SUMMARY"
          echo "- Artefato: anki-p-preview-apk" >> "$GITHUB_STEP_SUMMARY"
