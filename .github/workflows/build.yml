name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true # Força comportamento estável com Node 20
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Usa Node 20 explicitamente para evitar depreciação e erros de compatibilidade
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm test

      # Instalação explícita do EAS CLI (já funcionou nos logs anteriores)
      - name: Install EAS CLI
        run: npm install -g eas-cli

      # Autenticação manual usando o token dos secrets
      - name: Login to Expo
        run: eas login --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}
          # Nota: Se usar EXPO_TOKEN funcionar melhor, troque a variável acima e o secret no GitHub

      # Build Android
      - name: Build Android
        run: eas build --platform android --profile preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}

      # Opcional: Build iOS (requer conta Apple configurada no EAS)
      # - name: Build iOS
      #   run: eas build --platform ios --profile preview --non-interactive --no-wait
      #   env:
      #     EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}

      - name: Build Summary
        run: |
          echo "## 📱 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build iniciado com sucesso!" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Data**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 Acompanhe o status do build em: [EAS Build Console](https://expo.dev/accounts/[seu-account]/projects/[seu-projeto]/builds)" >> $GITHUB_STEP_SUMMARY
          echo "_Nota: O build roda em background (--no-wait). Verifique o console do EAS para baixar o APK quando pronto._" >> $GITHUB_STEP_SUMMARY
